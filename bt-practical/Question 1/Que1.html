<!-- Create Responsive Header using Offcanvas Component  -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bootstrap Practical Exam</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        font-family: 'Segoe UI', sans-serif;
        background:#f8f9fa;
    }

    /* Navbar */
    .navbar{
        background: linear-gradient(135deg,#4e54c8,#8f94fb);
    }

    .navbar-brand{
        font-size:1.5rem;
        font-weight:bold;
        color:white !important;
    }

    .nav-link{
        color:white !important;
        font-weight:500;
    }

    .btn-custom{
        background:white;
        color:#4e54c8;
        border-radius:30px;
        font-weight:600;
        padding:8px 20px;
        transition:.3s;
    }

    .btn-custom:hover{
        background:#4e54c8;
        color:white;
        border:1px solid white;
    }

    /* Hero Section */
    .hero{
        min-height:90vh;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        background: linear-gradient(
            rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)
        ),
        url('https://images.unsplash.com/photo-1498050108023-c5249f4df085');
        background-size:cover;
        background-position:center;
        color:white;
    }

    .hero h1{
        font-size:3.5rem;
        font-weight:bold;
    }

    .hero p{
        font-size:1.2rem;
        margin:20px 0;
    }

    .hero-btn{
        padding:12px 30px;
        border-radius:30px;
        font-weight:bold;
    }

    .offcanvas-header{
        background:#4e54c8;
        color:white;
    }

    .offcanvas-body a{
        display:block;
        padding:12px;
        text-decoration:none;
        color:#333;
        font-weight:500;
        border-radius:10px;
    }

    .offcanvas-body a:hover{
        background:#4e54c8;
        color:white;
    }
</style>

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-expand-lg shadow">
    <div class="container">

        <a class="navbar-brand" href="#">
            🚀 Full Stack Hub
        </a>

        <!-- Offcanvas Toggle Button -->
        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Desktop Menu -->
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav me-3">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>

            <button class="btn btn-custom">
                Login
            </button>
        </div>
    </div>
</nav>

<!-- Offcanvas -->
<div class="offcanvas offcanvas-start" id="menu">

    <div class="offcanvas-header">
        <h5>Menu</h5>

        <button class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas">
        </button>
    </div>

    <div class="offcanvas-body">
        <a href="#">🏠 Home</a>
        <a href="#">ℹ️ About</a>
        <a href="#">💼 Services</a>
        <a href="#">📞 Contact</a>
        <a href="#">🔑 Login</a>
    </div>

</div>

<!-- Hero Section -->
<section class="hero">
    <div class="container">

        <h1>Bootstrap Offcanvas Header</h1>

        <p>
            Responsive navigation using Bootstrap 5 Offcanvas Component.
            Perfect for Full Stack Practical Examination.
        </p>

        <button class="btn btn-warning hero-btn">
            Explore More
        </button>

    </div>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
